[project]
name = "boxd-match"
version = "0.1.0"
description = "Identify every title in a Letterboxd export (TMDB/IMDb) and match it against a local media library."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
boxd-match = "boxd_match.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/boxd_match"]

[tool.pytest.ini_options]
testpaths = ["tests"]
